<style>
@font-face{
  font-family:'HarmonyOS Sans SC';
  src:url('/static/HarmonyOS_Sans_SC_Regular.woff2') format('woff2');
  font-weight:400;font-style:normal;font-display:swap;
}
:root{
  --bg-a:#e6f2ff; --bg-b:#fff0f5; --bg-c:#f0f7ff; --bg-d:#fff5e6;
  --card:rgba(255,255,255,.86);
  --text:#1f2937; --muted:#64748b;
  --primary:#3b82f6; --primary-2:#60a5fa;
  --line:rgba(148,163,184,.28);
  --ok:#10b981; --warn:#f59e0b; --bad:#ef4444; --unk:#94a3b8;
  --shadow:0 10px 30px rgba(15,23,42,.10);
  --row:rgba(248,250,252,.85);
}
html[data-theme="dark"]{
  --bg-a:#0f172a; --bg-b:#111827; --bg-c:#0b1220; --bg-d:#131a2b;
  --card:rgba(23,31,45,.88);
  --text:#e2e8f0; --muted:#94a3b8;
  --primary:#60a5fa; --primary-2:#93c5fd;
  --line:rgba(148,163,184,.18);
  --shadow:0 10px 30px rgba(0,0,0,.5);
  --row:rgba(15,23,42,.55);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  color:var(--text); line-height:1.6; min-height:100vh;
  display:flex; justify-content:center; align-items:center;
  background:linear-gradient(-45deg,var(--bg-a),var(--bg-b),var(--bg-c),var(--bg-d));
  background-size:400% 400%; animation:bgmove 18s ease infinite;
  padding:24px 16px; font-size:16px; overflow-x:hidden;
  transition:background .4s,color .3s;
}
@keyframes bgmove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.wrap{width:100%;max-width:620px;position:relative}
.card{
  background:var(--card); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line); border-radius:22px; padding:28px 26px;
  box-shadow:var(--shadow); transition:box-shadow .3s;
}
.card:hover{box-shadow:0 16px 40px rgba(15,23,42,.16)}
h1{
  font-size:26px; font-weight:700; text-align:center; color:var(--primary);
  letter-spacing:.5px; margin-bottom:4px;
}
.sub{text-align:center;font-size:13px;color:var(--muted);margin-bottom:20px}
.theme-btn{
  position:absolute;top:20px;right:18px;width:36px;height:36px;border:none;border-radius:10px;
  background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;
  transition:.25s;z-index:5
}
.theme-btn:hover{background:var(--row);color:var(--primary)}
.bookmark{
  width:100%;display:flex;align-items:center;justify-content:center;gap:8px;
  padding:13px;border:none;border-radius:13px;cursor:pointer;

  box-shadow:0 6px 18px rgba(59,130,246,.32); transition:transform .2s,box-shadow .25s;
  margin-bottom:22px;font-family:inherit
}
.bookmark:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(59,130,246,.42)}
.bookmark:active{transform:translateY(0) scale(.99)}
ul{list-style:none;display:flex;flex-direction:column;gap:11px}
li{
  position:relative; background:var(--row); border:1px solid var(--line);
  border-left:4px solid var(--unk); border-radius:14px; padding:14px 15px;
  transition:transform .25s,box-shadow .25s,border-color .25s,opacity .25s
}
li:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(15,23,42,.10)}
li[data-state="ok"]{border-left-color:var(--ok)}
li[data-state="blocked"]{border-left-color:var(--warn)}
li[data-state="down"]{border-left-color:var(--bad)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.meta{min-width:0;flex:1}
.name{display:block;font-weight:600;font-size:15px;margin-bottom:2px}
.link{
  display:inline-flex;align-items:center;gap:5px;color:var(--primary);
  font-size:13px;text-decoration:none;word-break:break-all;line-height:1.4
}
.link:hover{color:var(--primary-2);text-decoration:underline}
.link svg{flex:0 0 auto;opacity:.75}
.state{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:0 0 auto}
.badge{
  font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;
  background:var(--unk);color:#fff;white-space:nowrap
}
.badge[data-state="ok"]{background:var(--ok)}
.badge[data-state="blocked"]{background:var(--warn)}
.badge[data-state="down"]{background:var(--bad)}
.ms{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats{
  margin-top:20px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;
  background:var(--row)
}
.stats-head{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-size:13px;color:var(--muted);margin-bottom:10px;flex-wrap:wrap
}
.stats-head strong{color:var(--text);font-weight:600}
.refresh{
  border:1px solid var(--line);background:transparent;color:var(--primary);
  font-size:12px;font-weight:600;padding:5px 12px;border-radius:999px;cursor:pointer;
  font-family:inherit;transition:.2s
}
.refresh:hover{background:var(--primary);color:#fff;border-color:transparent}
.refresh:disabled{opacity:.5;cursor:progress}
.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.count b{display:block;font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.count span{font-size:11px;color:var(--muted)}
.count.ok b{color:var(--ok)} .count.bad b{color:var(--bad)} .count.unk b{color:var(--unk)}
.notice{
  display:flex;gap:9px;align-items:flex-start;margin-top:14px;padding:11px 14px;
  border-radius:12px;background:rgba(59,130,246,.09);
  border-left:3px solid var(--primary);font-size:13px;color:var(--muted)
}
.notice svg{flex:0 0 auto;margin-top:2px;color:var(--primary)}
.stale{margin-top:10px;font-size:12px;color:var(--warn);display:none}
.stale.show{display:block}
.foot{margin-top:22px;text-align:center;font-size:12px;color:var(--muted);opacity:.85}
@media (max-width:520px){
  body{font-size:15px;padding:16px 12px}
  .card{padding:22px 16px;border-radius:18px}
  h1{font-size:20px}
  .sub{font-size:12px;margin-bottom:16px}

  li{padding:12px}

  .name{font-size:14px}
  .link{font-size:11px}
  .badge{font-size:11px;padding:2px 8px}
  .ms{font-size:10px}
  .count b{font-size:18px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

  <main class="card">

<script>
(function () {
  'use strict';

  /* ===== 配置 ===== */
  // 可选：Cloudflare Worker 实时探测接口（留空则只读定时任务生成的结果）
  // 例：'https://svip-status.xxx.workers.dev'
  var REALTIME_API = '';
  var STALE_MS = 40 * 60 * 1000;
  var AUTO_REFRESH_MS = 3 * 60 * 1000;

  var LABEL = { ok: '正常', blocked: '被拦截', down: '无法访问', unknown: '未知' };

  var $ = function (id) { return document.getElementById(id); };
  var list = $('urlList');
  var items = Array.prototype.slice.call(list.querySelectorAll('li'));

  /* ===== 主题 ===== */
  var SUN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var MOON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';

  function applyTheme(dark) {
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    $('themeBtn').innerHTML = dark ? SUN : MOON;
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', dark ? '#0f172a' : '#3b82f6');
    try { localStorage.setItem('svip-theme', dark ? 'dark' : 'light'); } catch (e) {}
  }

  (function initTheme() {
    var saved = null;
    try { saved = localStorage.getItem('svip-theme'); } catch (e) {}
    if (saved === 'dark' || saved === 'light') return applyTheme(saved === 'dark');
    applyTheme(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  })();

  $('themeBtn').addEventListener('click', function () {
    applyTheme(document.documentElement.getAttribute('data-theme') !== 'dark');
  });

  /* ===== 收藏 ===== */
  $('bookmarkBtn').addEventListener('click', function () {
    var ua = navigator.userAgent.toLowerCase();
    var key = ua.indexOf('mac') !== -1 ? 'Command/Cmd' : 'Ctrl';
    if (window.sidebar && window.sidebar.addPanel) {
      window.sidebar.addPanel(document.title, location.href, '');
    } else if (window.external && 'AddFavorite' in window.external) {
      window.external.AddFavorite(location.href, document.title);
    } else {
      alert('请按 ' + key + ' + D 将本页加入收藏夹。');
    }
  });

  /* ===== 数据源 ===== */
  // 定时任务生成 status.js：window.__PROBE_STATUS__ = {...}
  function loadLocalStatus() {
    return new Promise(function (resolve) {
      var s = document.createElement('script');
      s.src = './status.js?t=' + Date.now();
      s.async = true;
      s.onload = function () { resolve(window.__PROBE_STATUS__ || null); };
      s.onerror = function () { resolve(null); };
      document.head.appendChild(s);
    });
  }

  function loadRealtime() {
    var q = items.map(function (li) {
      return 'u=' + encodeURIComponent(li.dataset.url);
    }).join('&');
    return fetch(REALTIME_API + (REALTIME_API.indexOf('?') === -1 ? '?' : '&') + q, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      });
  }

  /* ===== 渲染 ===== */
  function fmtAgo(ts) {
    if (!ts) return '—';
    var d = new Date(ts);
    if (isNaN(d.getTime())) return '—';
    var diff = Date.now() - d.getTime();
    var txt;
    if (diff < 60000) txt = '刚刚';
    else if (diff < 3600000) txt = Math.floor(diff / 60000) + ' 分钟前';
    else if (diff < 86400000) txt = Math.floor(diff / 3600000) + ' 小时前';
    else txt = Math.floor(diff / 86400000) + ' 天前';
    var hh = ('0' + d.getHours()).slice(-2);
    var mm = ('0' + d.getMinutes()).slice(-2);
    return hh + ':' + mm + '（' + txt + '）';
  }

  function paint(li, rec) {
    var state = rec && rec.state ? rec.state : 'unknown';
    if (!LABEL[state]) state = 'unknown';
    li.dataset.state = state;

    var badge = li.querySelector('.badge');
    badge.dataset.state = state;
    badge.textContent = LABEL[state];

    var ms = li.querySelector('.ms');
    if (state === 'unknown') {
      ms.textContent = '—';
    } else if (rec && rec.ms != null) {
      var extra = rec.status ? ' · HTTP ' + rec.status : '';
      if (rec.note) extra = ' · ' + rec.note;
      ms.textContent = rec.ms + 'ms' + extra;
    } else {
      ms.textContent = '—';
    }
  }

  function render(data) {
    var targets = (data && data.targets) || {};
    var ok = 0, bad = 0, unk = 0;

    items.forEach(function (li) {
      var rec = targets[li.dataset.key] || null;
      paint(li, rec);
      var st = li.dataset.state;
      if (st === 'ok') ok++;
      else if (st === 'unknown') unk++;
      else bad++;
    });

    $('cntOk').textContent = ok;
    $('cntBad').textContent = bad;
    $('cntUnk').textContent = unk;
    $('lastChecked').textContent = data ? fmtAgo(data.updated) : '暂无数据';

    var tip = $('staleTip');
    var stale = !!(data && data.updated && (Date.now() - new Date(data.updated).getTime()) > STALE_MS);
    if (data) tip.textContent = '检测数据已超过 40 分钟未更新，仅供参考。';
    tip.classList.toggle('show', stale);
  }

  /* ===== 刷新 ===== */
  var busy = false;

  function refresh() {
    if (busy) return;
    busy = true;
    var btn = $('refreshBtn');
    btn.disabled = true;
    btn.textContent = '检测中…';

    var p = REALTIME_API ? loadRealtime().catch(function () { return null; }) : Promise.resolve(null);

    p.then(function (rt) {
      return rt || loadLocalStatus();
    }).then(function (data) {
      render(data);
      if (!data) {
        $('staleTip').textContent = '未取到检测结果（status.js 缺失或本地预览），请稍后再试。';
        $('staleTip').classList.add('show');
      }
    }).catch(function () {
      render(null);
    }).then(function () {
      busy = false;
      btn.disabled = false;
      btn.textContent = '重新检测';
    });
  }

  $('refreshBtn').addEventListener('click', refresh);
  refresh();

  setInterval(function () {
    if (document.visibilityState === 'visible') refresh();
  }, AUTO_REFRESH_MS);

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') refresh();
  });
})();
</script>
