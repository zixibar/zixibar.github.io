<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>服务状态 · Status</title>
  <meta name="description" content="实时服务可用性监控状态页" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='38' fill='%2334D399'/><circle cx='50' cy='50' r='16' fill='%2307070C'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

  <!-- Aurora background -->
  <div class="aurora" aria-hidden="true">
    <div class="aurora-blob blob-1"></div>
    <div class="aurora-blob blob-2"></div>
    <div class="aurora-blob blob-3"></div>
    <div class="noise"></div>
  </div>

  <div class="page">

    <!-- ============ Header ============ -->
    <header class="site-header">
      <div class="brand">
        <span class="brand-dot" id="brandDot"></span>
        <span class="brand-name" id="siteName">Status</span>
      </div>
      <div class="header-meta">
        <span class="updated" id="updatedAt">—</span>
        <button class="refresh-btn" id="refreshBtn" title="刷新数据">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
          <span>刷新</span>
        </button>
      </div>
    </header>

    <!-- ============ Hero status banner ============ -->
    <section class="hero glass" id="heroBanner">
      <div class="hero-left">
        <div class="hero-pulse" id="heroPulse"><span></span></div>
        <div>
          <h1 class="hero-title" id="heroTitle">正在检测服务状态…</h1>
          <p class="hero-sub" id="heroSub">正在连接 UptimeRobot API</p>
        </div>
      </div>
      <div class="hero-right" id="heroBadge">
        <span class="hero-badge skeleton-text">LOADING</span>
      </div>
    </section>

    <!-- ============ Overview stats ============ -->
    <section class="stats-grid" id="statsGrid">
      <div class="stat glass"><div class="stat-label">90 天平均可用率</div><div class="stat-value mono" id="statUptime">—</div></div>
      <div class="stat glass"><div class="stat-label">平均响应时间</div><div class="stat-value mono" id="statResponse">—</div></div>
      <div class="stat glass"><div class="stat-label">在线监控</div><div class="stat-value mono" id="statOnline">—</div></div>
      <div class="stat glass"><div class="stat-label">近 90 天故障</div><div class="stat-value mono" id="statIncidents">—</div></div>
    </section>

    <!-- ============ Monitors ============ -->
    <section class="section-head">
      <h2>监控服务</h2>
      <span class="section-line"></span>
    </section>
    <section class="monitors" id="monitors">
      <!-- skeleton -->
      <div class="monitor glass skeleton-card"></div>
      <div class="monitor glass skeleton-card"></div>
    </section>

    <!-- ============ Incidents ============ -->
    <section class="section-head">
      <h2>故障历史</h2>
      <span class="section-line"></span>
    </section>
    <section class="incidents glass" id="incidents">
      <div class="incident-empty">暂无数据</div>
    </section>

    <!-- ============ Footer ============ -->
    <footer class="site-footer">
      <span>数据由 <a href="https://stats.uptimerobot.com/hlb16oyImz" target="_blank" rel="noopener">UptimeRobot</a> 提供</span>
      <span class="dot-sep">·</span>
      <span id="refreshNote">每 60 秒自动刷新</span>
    </footer>
  </div>

  <!-- Tooltip -->
  <div class="tooltip mono" id="tooltip" hidden></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
