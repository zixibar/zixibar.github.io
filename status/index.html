<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>服务状态页</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="hero">
    <div class="hero-inner">
      <h1 id="site-name">📡 服务状态页</h1>
      <p class="subtitle" id="site-subtitle">由 UptimeRobot 监控 · 每 30 秒自动刷新</p>

      <!-- 整体状态概览 -->
      <div class="overview">
        <div class="ov-card" id="ov-status">
          <div class="ov-value" id="ov-status-value">--</div>
          <div class="ov-label">整体状态</div>
        </div>
        <div class="ov-card">
          <div class="ov-value" id="ov-operational-value">--</div>
          <div class="ov-label">运行正常</div>
        </div>
        <div class="ov-card">
          <div class="ov-value" id="ov-down-value">--</div>
          <div class="ov-label">宕机</div>
        </div>
        <div class="ov-card">
          <div class="ov-value" id="ov-paused-value">--</div>
          <div class="ov-label">暂停</div>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- 状态徽章说明 -->
    <div class="legend">
      <span class="lg-item"><span class="dot dot-ok"></span> 正常</span>
      <span class="lg-item"><span class="dot dot-warn"></span> 宕机</span>
      <span class="lg-item"><span class="dot dot-paused"></span> 暂停</span>
      <span class="lg-item"><span class="dot dot-unknown"></span> 未知</span>
    </div>

    <!-- 监控列表（由 JS 动态渲染） -->
    <div class="monitor-list" id="monitor-list">
      <div class="loading">正在加载监控数据…</div>
    </div>

    <footer class="footer">
      <span id="last-update">最后更新：--</span>
      <span class="sep">·</span>
      <span>数据来源 UptimeRobot API</span>
    </footer>
  </main>

  <!-- 配置文件（先加载） -->
  <script src="config.js"></script>
  <!-- 主逻辑 -->
  <script src="app.js"></script>
</body>
</html>
