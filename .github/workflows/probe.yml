name: probe

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'probe.mjs'
      - '.github/workflows/probe.yml'

permissions:
  contents: write

concurrency:
  group: probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 探测线路状态
        run: node probe.mjs

      - name: 提交结果
        run: |
          git config user.name "svip-probe-bot"
          git config user.email "svip-probe-bot@users.noreply.github.com"
          git add status.js status.json
          if git diff --cached --quiet; then
            echo "状态无变化，跳过提交"
          else
            git commit -m "chore: 更新线路状态 [skip ci]"
            git push
          fi
